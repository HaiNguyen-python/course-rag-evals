[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-rag"
version = "0.1.0"
description = "A course-material RAG assistant with incremental indexing, hybrid retrieval and an evaluation gate in CI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hai Nguyen" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pypdf>=4.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
neural = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8", "ruff>=0.5", "psycopg[binary]>=3.1", "pgvector>=0.3",
  "pytest-cov>=5", "mypy>=1.10", "pre-commit>=3.7", "matplotlib>=3.8",
]

[project.scripts]
course-rag = "course_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=course_rag --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.coverage.run]
source = ["course_rag"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
